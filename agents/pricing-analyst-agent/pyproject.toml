[project]
name = "pricing-analyst-agent"
version = "0.1.0"
description = "Pricing analyst demo with procedural memory and contract guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "runner-shared[mongodb,tracing]",
    "atlasap-sdklanggraph",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "langchain-cerebras>=0.8.2",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=1.4.0",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
pricing-analyst-agent = "pricing_analyst_agent.main:main"
pricing-analyst-seed-memories = "pricing_analyst_agent.seed_memories:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing_analyst_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=7.4.0",
    "pytest-env>=1.1",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
env = [
    "RUNNER_MODE=aer",
]

[tool.uv.sources]
runner-shared = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/runner-shared" }
atlasap-sdklanggraph = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/atlasap-sdklanggraph" }
atlasap-sdk-core = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/sdk-core" }
mongomem = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/mongomem" }

[tool.ruff]
line-length = 100
target-version = "py311"
