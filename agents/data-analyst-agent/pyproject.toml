[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Data analyst demo with MongoDB artifacts, memory, and native LangGraph review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "runner-shared[mongodb,tracing]",
    "atlasap-sdklanggraph",
    "atlasap-sdk-core",
    "python-dotenv>=1.0.0",
    "pymongo>=4.6.0",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=1.4.0",
    "langchain-cerebras>=0.8.2",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
]

[project.scripts]
data-analyst-agent = "data_analyst_agent.main:main"
data-analyst-seed-demo = "data_analyst_agent.seed_demo:main"
data-analyst-seed-data = "data_analyst_agent.seed_data:main"
data-analyst-seed-memories = "data_analyst_agent.seed_memories:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=7.4.0",
    "pytest-env>=1.1",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
env = [
    "RUNNER_MODE=aer",
    "RUNNER_ALLOW_DIRECT_TOOL_EXECUTION=true",
]

[tool.uv.sources]
runner-shared = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/runner-shared" }
atlasap-sdklanggraph = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/atlasap-sdklanggraph" }
atlasap-sdk-core = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/sdk-core" }

[tool.ruff]
line-length = 100
target-version = "py311"
