name: data-analyst-agent
entrypoint: data_analyst_agent.main:app
framework: langgraph
build:
  context: .

# Optional LLM hints. Application code reads these via app.llm_config when
# building provider clients; tests and deterministic demo paths do not require
# an API key.
config:
  provider: openai
  model: gpt-5.4-mini

features:
  memory: true

required_secrets:
  aer:
    - "<YOUR LLM API KEY HERE>"
  tools:
    # invoke_llm is a reserved tool name: the platform runs model calls in a
    # tool pod, so the provider key the LLM needs is declared here, not under a
    # user-defined tool.
    invoke_llm:
      - "<YOUR LLM API KEY HERE>"
