name: remote-mcp
entrypoint: remote_mcp.github:app
framework: langgraph
build:
  context: .

config:
  provider: openai
  model: gpt-5.4-mini

features:
  guardrails: false
  memory: false

mcp:
  servers:
    github:
      transport: streamable_http
      url: https://api.githubcopilot.com/mcp/
      headers:
        X-MCP-Readonly: "true"
        X-MCP-Toolsets: repos,issues,pull_requests,actions
      auth:
        type: bearer_env
        token_env: GITHUB_MCP_TOKEN
      timeout_seconds: 30
