name: remote-mcp
entrypoint: remote_mcp.main:app
framework: langgraph
build:
  context: .

config:
  provider: openai
  model: gpt-5.4-mini

features:
  guardrails: false
  memory: false

mcp:
  servers:
    github:
      transport: streamable_http
      url: https://api.githubcopilot.com/mcp/
      headers:
        X-MCP-Readonly: "true"
        X-MCP-Toolsets: repos,issues,pull_requests,actions
      auth:
        type: bearer_env
        token_env: GITHUB_MCP_TOKEN
      timeout_seconds: 30
    sentry:
      transport: streamable_http
      url: https://mcp.sentry.dev/mcp
      auth:
        type: oauth
        scope: "org:read project:read team:read event:read"
      timeout_seconds: 30
    glean:
      transport: streamable_http
      url: https://mongodb-be.glean.com/mcp/default
      auth:
        type: oauth
        scope: "mcp search documents entities"
        client_name: Magenta Glean Remote MCP Agent
      timeout_seconds: 30
    atlas:
      transport: streamable_http
      # Atlas Remote MCP currently supports cloud-dev only.
      url: https://cloud-dev.mongodb.com/api/private/mcp
      auth:
        type: client_credentials
        token_url: https://cloud-dev.mongodb.com/api/oauth/token
        client_id_env: MCP_GROUP_SA_ID_DEV
        client_secret_env: MCP_GROUP_SA_SECRET_DEV
      timeout_seconds: 30
