[project]
name = "remote-mcp"
version = "0.1.0"
description = "Remote MCP example agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "magenta-sdklanggraph",
    "langchain-anthropic>=1.4.0",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=1.1.12",
    "mcp>=1.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
remote-mcp = "remote_mcp.main:main"
remote-mcp-all = "remote_mcp.main:main"
remote-mcp-atlas = "remote_mcp.atlas:main"
remote-mcp-github = "remote_mcp.github:main"
remote-mcp-glean = "remote_mcp.glean:main"
remote-mcp-sentry = "remote_mcp.sentry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_mcp"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.uv.sources]
magenta-sdklanggraph = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/magenta-sdklanggraph" }

[tool.ruff]
line-length = 100
target-version = "py311"
