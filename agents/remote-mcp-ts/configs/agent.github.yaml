name: remote-mcp-ts
entrypoint: remote_mcp_ts.github:app
framework: langgraph
language: typescript
build:
  context: .

config:
  provider: openai
  model: gpt-5.4-mini

features:
  guardrails: false
  memory: false

required_secrets:
  aer:
    - OPENAI_API_KEY
    - OPENAI_BASE_URL
    - GITHUB_MCP_TOKEN
  tools:
    invoke_llm:
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
    "*":
      - GITHUB_MCP_TOKEN

mcp:
  servers:
    github:
      transport: streamable_http
      url: https://api.githubcopilot.com/mcp/
      headers:
        X-MCP-Readonly: "true"
        X-MCP-Toolsets: repos,issues,pull_requests,actions
      auth:
        type: bearer_env
        token_env: GITHUB_MCP_TOKEN
      timeout_seconds: 30
