# Local services exposed by the app during `agentic dev`.
# Most host ports are assigned randomly so multiple agents can run at once.
# This agent is designed to run alongside other agents, so all ports are
# dynamic by default. To pin a service, uncomment its block and restart.
# services:
#   playground:
#     port: 3020  # Use a non-default port to avoid clashing with other agents.
#   oe:
#     port: 8000  # Orchestration Engine HTTP API.
#   aer:
#     port: 8001  # Agent Execution Runtime.
#   tool:
#     port: 8002  # Tool execution runtime.
#   memory-server:
#     port: 8081  # Long-term memory service.
#   mongodb:
#     local: true  # Default true. Set false to use a remote Atlas cluster in local dev.
#     port: 27017  # Local Atlas host port; ignored when local is false.
