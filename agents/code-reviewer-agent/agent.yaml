name: code-reviewer-agent
entrypoint: code_reviewer_agent.main:app
framework: langgraph
description: Code reviewer agent demonstrating App.deep_agent() skills scaffold
build:
  context: .

features:
  deep_agent: true

required_secrets:
  aer:
    - "<YOUR LLM API KEY HERE>"
    - GITHUB_TOKEN
  tools:
    # invoke_llm is a reserved tool name: the platform runs model calls in a
    # tool pod, so the provider key the LLM needs is declared here, not under a
    # user-defined tool.
    invoke_llm:
      - "<YOUR LLM API KEY HERE>"
