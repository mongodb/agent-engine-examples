[project]
name = "memory-test-agent"
version = "0.1.0"
description = "Memory policy test agent — exercises user_id/visibility access control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "atlasap-sdklanggraph",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
memory-test-agent = "memory_test_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_test_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.uv.sources]
atlasap-sdklanggraph = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/atlasap-sdklanggraph" }

[tool.ruff]
line-length = 100
target-version = "py311"
