[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-agent"
version = "0.1.0"
description = "Simple weather agent for testing atlasap-sdklanggraph"
requires-python = ">=3.11"
dependencies = [
    "runner-shared",
    "atlasap-sdklanggraph",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain-cerebras>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weather_agent"]

[tool.uv.sources]
runner-shared = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/runner-shared" }
atlasap-sdklanggraph = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/atlasap-sdklanggraph" }

[tool.ruff]
line-length = 100
target-version = "py311"
