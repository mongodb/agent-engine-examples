[project]
name = "atlas-admin-agent"
version = "0.1.0"
description = "MongoDB Atlas Administration API agent with human-in-the-loop approval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "atlasap-sdklanggraph",
    "runner-shared",
    "python-dotenv>=1.0.0",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-cerebras>=0.8.2",
    "httpx>=0.27.0",
    "pymongo>=4.6.0",
]

[project.scripts]
atlas-admin-agent = "atlas_admin_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_admin_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=7.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.1.0",
]

[tool.uv.sources]
atlasap-sdklanggraph = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/atlasap-sdklanggraph" }
runner-shared = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/runner-shared" }

[tool.ruff]
line-length = 100
target-version = "py311"
