[project]
name = "store-manager-agent"
version = "0.1.0"
description = "Store Manager Copilot — a retail store-operations assistant (reports / inventory / expiry / planogram) backed by MongoDB, with four memory types and human-in-the-loop approvals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "magenta-sdklanggraph",
    "runner-shared",
    "python-dotenv>=1.0.0",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-cerebras>=0.8.2",
    "pymongo>=4.6.0",
]

[project.scripts]
store-manager-agent = "store_manager_agent.main:main"
store-manager-seed = "store_manager_agent.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store_manager_agent"]

[tool.uv.sources]
magenta-sdklanggraph = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/magenta-sdklanggraph" }
runner-shared = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/runner-shared" }

[tool.ruff]
line-length = 100
target-version = "py311"
