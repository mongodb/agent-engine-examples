[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mta-alerts-agent"
version = "0.1.0"
description = "MTA subway service alerts agent"
requires-python = ">=3.11"
dependencies = [
    "runner-shared",
    "atlasap-sdklanggraph",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain-openai>=0.2",
    "langchain-anthropic>=1.4.0",
    "langchain-google-genai>=2.0",
    "langchain-cerebras>=0.3",
    "langgraph>=0.2",
    "httpx>=0.27",
    "gtfs-realtime-bindings>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mta_alerts_agent"]

[tool.uv.sources]
runner-shared = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/runner-shared" }
atlasap-sdklanggraph = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/atlasap-sdklanggraph" }
