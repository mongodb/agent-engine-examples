name: holiday-assistant-agent
entrypoint: holiday_assistant_agent.main:app
framework: langgraph
build:
  context: .

# Long-term memory keeps preferences, prior bookings, and conversation
# summaries across sessions. Requires VOYAGE_API_KEY in .env.
features:
  guardrails: false
  memory: true

required_secrets:
  aer:
    - "<YOUR LLM API KEY HERE>"
  tools:
    # invoke_llm is a reserved tool name: the platform runs model calls in a
    # tool pod, so the provider key the LLM needs is declared here, not under a
    # user-defined tool.
    invoke_llm:
      - "<YOUR LLM API KEY HERE>"
