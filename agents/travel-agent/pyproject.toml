[project]
name = "travel-agent"
version = "0.1.0"
description = "Travel disruption and re-accommodation demo built on the Runner SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "runner-shared",
    "atlasap-sdklanggraph",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-cerebras>=0.8.2",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=1.1.12",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-mongodb>=0.2.0",
    "pymongo>=4.0.0",
    "grpcio>=1.78.0",
    "grpcio-health-checking>=1.78.0",
]

[project.scripts]
travel-agent = "travel_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=7.4.0",
    "pytest-env>=1.1",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
env = [
    "RUNNER_MODE=aer",
]

[tool.uv.sources]
runner-shared = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/runner-shared" }
atlasap-sdklanggraph = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/atlasap-sdklanggraph" }
atlasap-sdk-core = { git = "https://github.com/10gen/atlasap-client-libraries", subdirectory = "packages/sdk-core" }

[tool.ruff]
line-length = 100
target-version = "py311"
