[tool.uv.workspace]
members = [
    "agents/atlas-admin-agent",
    "agents/code-reviewer-agent",
    "agents/data-analyst-agent",
    "agents/docs-update-agent",
    "agents/holiday-assistant-agent",
    "agents/insurance-agent",
    "agents/mta-alerts-agent",
    "agents/pricing-analyst-agent",
    "agents/recruiting-assistant-agent",
    "agents/remote-mcp",
    "agents/simple-agent",
    "agents/store-manager-agent",
    "agents/travel-agent",
    "agents/weather-agent",
    "agents/memory-test-agent",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agents/atlas-admin-agent/src", "agents/code-reviewer-agent/src", "agents/data-analyst-agent/src", "agents/docs-update-agent/src", "agents/insurance-agent/src", "agents/memory-test-agent/src", "agents/mta-alerts-agent/src", "agents/recruiting-assistant-agent/src", "agents/remote-mcp/src", "agents/simple-agent/src", "agents/store-manager-agent/src", "agents/travel-agent/src", "agents/weather-agent/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
