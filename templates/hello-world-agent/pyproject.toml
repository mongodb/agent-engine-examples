[project]
name = "hello-world-agent"
version = "0.1.0"
description = "Minimal agent hello-world starter template"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-runner-shared[mongodb]>=0.11.3,<1",
    "agent-engine-sdk-langgraph>=0.11.3,<1",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.1.12",
    "langchain-xai>=1.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-anthropic>=1.4.0",
]

[project.scripts]
hello-world-agent = "hello_world_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_world_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
