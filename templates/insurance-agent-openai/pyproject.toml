[project]
name = "insurance-agent-openai"
version = "0.1.0"
description = "Insurance agent starter template for Agent Engine using the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-sdk-openai-agents>=0.11.10,<1",
    "openai-agents>=0.22.0,<1",
    "pydantic>=2.0",
    "pymongo>=4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
insurance-agent-openai = "insurance_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
