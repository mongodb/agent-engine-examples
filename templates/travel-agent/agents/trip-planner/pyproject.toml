[project]
name = "trip-planner"
version = "0.1.0"
description = "Travel agent starter template for Agent Engine"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-sdk-langgraph>=0.11.4,<1",
    "langchain>=1.3.17",
    "langchain-openai>=1.1.12",
    "langgraph>=1.2.11",
    "pymongo>=4.9",
    "python-dotenv>=1.0",
]

[project.scripts]
trip-planner = "trip_planner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_planner"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
