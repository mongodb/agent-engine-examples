# Human-readable app slug used by Agentic Platform tooling.
# `agentic create` should rewrite this when generating a new app from the template.
name: hello-world-agent
# Node entry point for the Magenta-SDK-equivalent App instance.
# Format: <module path>:<export name>. This template exposes `app` from
# src/hello_world_agent/main.ts (compiled to dist/hello_world_agent/main.js).
entrypoint: hello_world_agent.main:app
framework: langgraph
# Programming language for this agent.
language: typescript
config:
    provider: openai
    model: gpt-4o-mini
features:
    memory: false
