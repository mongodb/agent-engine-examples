[project]
name = "insurance-agent-adk"
version = "0.1.0"
description = "Insurance agent starter template for Agent Engine using Google ADK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-runner-shared[mongodb,tracing]>=0.11.3,<1",
    "agent-engine-sdk-adk>=0.11.3,<1",
    "google-adk[extensions]>=2.6.2,<3",
    "pydantic>=2.0",
    "pymongo>=4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
insurance-agent-adk = "insurance_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
